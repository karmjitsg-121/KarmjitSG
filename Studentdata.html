<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-section { margin-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #45a049; }
        #resume-output { margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px; display: none; }
        .resume-section { margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Student Data</h1>
    <p>Fill out the form below form to get registered.</p>

    <div class="form-section">
        <h2>Personal Information</h2>
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Riyaz Aly">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="riyaz.aly@example.com">

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" placeholder="+91 123456789">

        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="123 Main St, City, State, ZIP">
    </div>

    <div class="form-section">
        <h2>Education</h2>
        <label for="education">Education Details:</label>
        <textarea id="education" rows="4" placeholder="e.g., Bachelor of Science in Computer Science, University Name, 2018-2022"></textarea>
    </div>

    <div class="form-section">
        <h2>College Name</h2>
        <label for="experience">Course Details:</label>
        <textarea id="experience" rows="6" placeholder="e.g., Software Engineer at xyz University, ............."></textarea>
    </div>

    <div class="form-section">
        <h2>Skills</h2>
        <label for="skills">Skills:</label>
        <textarea id="skills" rows="3" placeholder="e.g., JavaScript, Python, HTML/CSS, Team Leadership"></textarea>
    </div>

    <button onclick="generateResume()">Get Registered</button>

    <div id="resume-output">
        <h2>Register</h2>
        <div id="resume-content"></div>
        <button onclick="downloadResume()">Download as Text</button>
    </div>

    <script>
        function generateResume() {
            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert('Please enter your full name.');
                return;
            }
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const education = document.getElementById('education').value;
            const experience = document.getElementById('experience').value;
            const skills = document.getElementById('skills').value;

            const resumeHTML = `
                <div class="resume-section">
                    <h3>${name}</h3>
                    <p>${email || 'N/A'} | ${phone || 'N/A'} | ${address || 'N/A'}</p>
                </div>
                <div class="resume-section">
                    <h4>Education</h4>
                    <p>${education || 'Not provided'}</p>
                </div>
                <div class="resume-section">
                    <h4>Work Experience</h4>
                    <p>${experience || 'Not provided'}</p>
                </div>
                <div class="resume-section">
                    <h4>Skills</h4>
                    <p>${skills || 'Not provided'}</p>
                </div>
            `;

            document.getElementById('resume-content').innerHTML = resumeHTML;
            document.getElementById('resume-output').style.display = 'block';
        }

        function downloadResume() {
            const content = document.getElementById('resume-content').innerText;
            if (!content.trim()) {
                alert('Generate a resume first.');
                return;
            }
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'resume.txt';
            link.click();
        }
    </script>
</body>
</html>
